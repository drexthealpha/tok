name: verifiable build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verifiable:
    name: verifiable build (solana-verify)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: sv
        with:
          path: ~/.cargo/bin/solana-verify
          key: solana-verify-0.5.2
      - if: steps.sv.outputs.cache-hit != 'true'
        run: cargo install solana-verify --version 0.5.2 --locked
      - name: Build in solana-verify's Docker image
        run: solana-verify build --library-name tok_claim
      - name: Hash
        run: |
          solana-verify get-executable-hash target/deploy/tok_claim.so | tee target/deploy/tok_claim.verify-hash
          sha256sum target/deploy/tok_claim.so
      - uses: actions/upload-artifact@v4
        with:
          name: tok-claim-verifiable
          path: target/deploy/tok_claim.*

