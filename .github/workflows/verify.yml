name: verifiable build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verifiable:
    name: verifiable build (solana-verify)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: sv
        with:
          path: ~/.cargo/bin/solana-verify
          key: solana-verify-0.5.2
      - if: steps.sv.outputs.cache-hit != 'true'
        run: cargo install solana-verify --version 0.5.2 --locked
      - name: Build in solana-verify's Docker image
        run: solana-verify build --library-name tok_claim --base-image solanafoundation/solana-verifiable-build:4.3.0
      - name: Hash
        run: |
          mkdir -p out
          sudo cp target/deploy/tok_claim.so out/
          sudo chown -R "$(id -u)" out
          solana-verify get-executable-hash out/tok_claim.so | tee out/tok_claim.verify-hash
          echo "commit ${GITHUB_SHA}" >> out/tok_claim.verify-hash
      - name: Compare with the program on devnet
        run: |
          solana-verify get-program-hash -u https://api.devnet.solana.com 2pZCUFv63kde6rkaAaZ3GGhUu4u4jzM8kBcyshZ9qauH | tee out/devnet-hash
          test "$(head -1 out/tok_claim.verify-hash)" = "$(cat out/devnet-hash)" && echo "MATCH: devnet program equals this build"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tok-claim-verifiable
          path: out/

