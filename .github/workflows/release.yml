name: release

# A tag v* publishes a GitHub release with the Android app and the exact
# claim program bytes deployed on devnet, each signed with Sigstore (keyless,
# through GitHub's OIDC identity) so anyone can check where they came from.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with: { gradle-version: '8.11.1' }
      - name: Android app
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Program bytes from devnet
        run: |
          npm install --no-save bs58@6.0.0
          node scripts/fetch-program.mjs 2pZCUFv63kde6rkaAaZ3GGhUu4u4jzM8kBcyshZ9qauH out/tok_claim-devnet.so
          cp android/app/build/outputs/apk/debug/app-debug.apk out/tok-android.apk
          cd out && sha256sum * > SHA256SUMS
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign with Sigstore
        run: |
          cd out
          for f in tok_claim-devnet.so tok-android.apk SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: out/*
          body: |
            Tok on Solana devnet. Claim program `2pZCUFv63kde6rkaAaZ3GGhUu4u4jzM8kBcyshZ9qauH` (upgrade key removed).
            Each file has a Sigstore bundle. Check one with:
            `cosign verify-blob --bundle tok-android.apk.sigstore.json --certificate-identity-regexp 'https://github.com/drexthealpha/tok/' --certificate-oidc-issuer https://token.actions.githubusercontent.com tok-android.apk`
